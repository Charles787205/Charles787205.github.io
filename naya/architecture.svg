<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg)"/>
  
  <!-- Subtle Grid lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="85" x2="1200" y2="85" />
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="255" x2="1200" y2="255" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="0" y1="425" x2="1200" y2="425" />
    <line x1="0" y1="510" x2="1200" y2="510" />
    <line x1="0" y1="595" x2="1200" y2="595" />
    <line x1="150" y1="0" x2="150" y2="680" />
    <line x1="300" y1="0" x2="300" y2="680" />
    <line x1="450" y1="0" x2="450" y2="680" />
    <line x1="600" y1="0" x2="600" y2="680" />
    <line x1="750" y1="0" x2="750" y2="680" />
    <line x1="900" y1="0" x2="900" y2="680" />
    <line x1="1050" y1="0" x2="1050" y2="680" />
  </g>

  <!-- Title & Architecture Header -->
  <text x="60" y="65" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">Naya — Home Services Platform Architecture</text>
  <text x="60" y="95" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Modular Monolith with Clean Architecture &amp; Domain-Driven Design (ASP.NET Core / C#)</text>
  
  <!-- Top: API Gateway / Host Layer -->
  <rect x="60" y="130" width="1080" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="75" y="145" width="220" height="40" rx="8" fill="url(#cyanGrad)" opacity="0.9"/>
  <text x="185" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Host / Web API Layer</text>
  <text x="320" y="162" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Unified ASP.NET Core Application Root</text>
  <text x="320" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Endpoint Routing · JWT Authentication · Swagger · Global Exception Handling</text>

  <!-- Modules Grid Header -->
  <text x="60" y="245" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ISOLATED BUSINESS MODULES</text>
  
  <!-- 4 Module Columns -->
  <!-- 1. Catalog Module -->
  <g transform="translate(60, 265)">
    <rect width="250" height="260" rx="12" fill="#131c31" stroke="#1e3a8a" stroke-width="1.5"/>
    <rect x="12" y="12" width="226" height="34" rx="6" fill="#1d4ed8"/>
    <text x="125" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Catalog Module</text>
    
    <!-- Clean Layers -->
    <rect x="16" y="60" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="84" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Domain Layer</text>
    <text x="220" y="84" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Services, Entities</text>

    <rect x="16" y="108" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="132" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Application Layer</text>
    <text x="220" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">CQRS, Handlers</text>

    <rect x="16" y="156" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="180" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Infrastructure</text>
    <text x="220" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">EF Core, Repos</text>

    <rect x="16" y="204" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="228" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Public Contracts</text>
    <text x="220" y="228" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">DTOs &amp; Events</text>
  </g>

  <!-- 2. Orders Module -->
  <g transform="translate(336, 265)">
    <rect width="250" height="260" rx="12" fill="#131c31" stroke="#047857" stroke-width="1.5"/>
    <rect x="12" y="12" width="226" height="34" rx="6" fill="#059669"/>
    <text x="125" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Orders Module</text>

    <rect x="16" y="60" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="84" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Domain Layer</text>
    <text x="220" y="84" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Bookings, State</text>

    <rect x="16" y="108" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="132" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Application Layer</text>
    <text x="220" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Order Workflows</text>

    <rect x="16" y="156" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="180" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Infrastructure</text>
    <text x="220" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Persistence</text>

    <rect x="16" y="204" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="228" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Public Contracts</text>
    <text x="220" y="228" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Order APIs</text>
  </g>

  <!-- 3. Users Module -->
  <g transform="translate(612, 265)">
    <rect width="250" height="260" rx="12" fill="#131c31" stroke="#b45309" stroke-width="1.5"/>
    <rect x="12" y="12" width="226" height="34" rx="6" fill="#d97706"/>
    <text x="125" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Users Module</text>

    <rect x="16" y="60" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="84" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Domain Layer</text>
    <text x="220" y="84" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Customer Profile</text>

    <rect x="16" y="108" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="132" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Application Layer</text>
    <text x="220" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Provider Ops</text>

    <rect x="16" y="156" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="180" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Infrastructure</text>
    <text x="220" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">DB Context</text>

    <rect x="16" y="204" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="228" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Public Contracts</text>
    <text x="220" y="228" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">User Inquiries</text>
  </g>

  <!-- 4. Auth Module -->
  <g transform="translate(888, 265)">
    <rect width="250" height="260" rx="12" fill="#131c31" stroke="#6d28d9" stroke-width="1.5"/>
    <rect x="12" y="12" width="226" height="34" rx="6" fill="#7c3aed"/>
    <text x="125" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Auth Module</text>

    <rect x="16" y="60" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="84" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Domain Layer</text>
    <text x="220" y="84" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Roles, Claims</text>

    <rect x="16" y="108" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="132" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Application Layer</text>
    <text x="220" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Token Services</text>

    <rect x="16" y="156" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="180" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Infrastructure</text>
    <text x="220" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">ASP.NET Identity</text>

    <rect x="16" y="204" width="218" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="26" y="228" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Public Contracts</text>
    <text x="220" y="228" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Security Tokens</text>
  </g>

  <!-- Database & Integration Layer at bottom -->
  <rect x="60" y="555" width="1080" height="75" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="585" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PERSISTENCE &amp; INTEGRATION</text>
  <text x="80" y="608" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Entity Framework Core · PostgreSQL / SQL Server · Outbox Pattern for Inter-Module Events</text>
  
  <rect x="940" y="570" width="180" height="42" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="1030" y="596" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Modular DB Schema</text>
</svg>
